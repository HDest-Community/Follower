name: Build PK3
description: Builds the PK3
runs:
  using: "composite"
  steps:
  - uses: actions/checkout@v4
  - uses: montudor/action-zip@v1
    with:
      args: zip -r "follower-${{ env.SUFFIX }}.pk3" . -i brightmaps/* filter/* graphics/* models/* patches/* sounds/* sprites/* zscript/* ANIMDEFS CHANGELOG.md CVARINFO DECALDEF.* GLDEFS.* HDCINFO KEYCONF LANGUAGE LANGUAGE.* LICENSE MAPINFO MENUDEF MODELDEF.* README.* SNDINFO.* TEXTCOLO TEXTURES.* TRNSLATE UGBLKLIST VOXELDEF.* WTBLKLST ZSCRIPT.zsc
